name: lapis-nostr-registry-local-quorum

x-lapis-relay: &lapis-relay
  image: ${LAPIS_RELAY_IMAGE:-nostr-relay-lapis:local}
  environment: &lapis-relay-environment
    GRAIN_DATA_DIR: /home/grain/.grain
    GRAIN_ENV: development
    GRAIN_OWNER_PUBKEY: ${REGISTRY_OPERATOR_PUBKEYS:?fixture operator is missing}
    LAPIS_DATABASE_MAP_SIZE_MB: ${LAPIS_DATABASE_MAP_SIZE_MB:-256}
    LAPIS_DATABASE_INGEST_THREADS: ${LAPIS_DATABASE_INGEST_THREADS:-1}
    LAPIS_MEMBERSHIP_REGISTRATION_KIND: "64007"
    LAPIS_MEMBERSHIP_DECISION_KIND: "64008"
    LAPIS_COMMUNITY_KINDS: "0,3,7,1111,1984,30267,64006"
    LAPIS_CURATOR_KINDS: "64000"
    LAPIS_SECURITY_KINDS: "64004,64005"
    LAPIS_OPERATOR_KINDS: "1063,1985,64001,64002,64003"
    LAPIS_MEMBERSHIP_ADMIN_PUBKEYS: ${LAPIS_MEMBERSHIP_ADMIN_PUBKEYS:?fixture membership administrator is missing}
    LAPIS_CURATOR_PUBKEYS: ${LAPIS_CURATOR_PUBKEYS:?fixture curator is missing}
    LAPIS_SECURITY_PUBKEYS: ${LAPIS_SECURITY_PUBKEYS:?fixture security identity is missing}
    LAPIS_OPERATOR_PUBKEYS: ${LAPIS_OPERATOR_PUBKEYS:?fixture operators are missing}
  healthcheck:
    test:
      [
        "CMD",
        "wget",
        "--no-verbose",
        "--tries=1",
        "--spider",
        "http://127.0.0.1:8181/",
      ]
    interval: 5s
    timeout: 3s
    retries: 30
    start_period: 20s
  restart: unless-stopped

services:
  registry-official-a:
    <<: *lapis-relay
    environment:
      <<: *lapis-relay-environment
      LAPIS_RELAY_URL: ws://127.0.0.1:${LAPIS_RELAY_A_PORT:-8281}
    ports: ["${LAPIS_RELAY_A_PORT:-8281}:8181"]
    volumes: [registry-official-a-data:/home/grain/.grain]

  registry-official-b:
    <<: *lapis-relay
    environment:
      <<: *lapis-relay-environment
      LAPIS_RELAY_URL: ws://127.0.0.1:${LAPIS_RELAY_B_PORT:-8282}
    ports: ["${LAPIS_RELAY_B_PORT:-8282}:8181"]
    volumes: [registry-official-b-data:/home/grain/.grain]

  registry-official-c:
    <<: *lapis-relay
    environment:
      <<: *lapis-relay-environment
      LAPIS_RELAY_URL: ws://127.0.0.1:${LAPIS_RELAY_C_PORT:-8283}
    ports: ["${LAPIS_RELAY_C_PORT:-8283}:8181"]
    volumes: [registry-official-c-data:/home/grain/.grain]

  registry-community:
    <<: *lapis-relay
    environment:
      <<: *lapis-relay-environment
      LAPIS_RELAY_URL: ws://127.0.0.1:${LAPIS_COMMUNITY_RELAY_PORT:-8381}
    ports: ["${LAPIS_COMMUNITY_RELAY_PORT:-8381}:8181"]
    volumes: [registry-community-data:/home/grain/.grain]

  registry-fixture:
    environment:
      REGISTRY_OFFICIAL_RELAYS: ws://registry-official-a:8181,ws://registry-official-b:8181,ws://registry-official-c:8181
      REGISTRY_COMMUNITY_RELAY: ws://registry-community:8181
      REGISTRY_PUBLIC_OFFICIAL_RELAYS: ws://127.0.0.1:${LAPIS_RELAY_A_PORT:-8281},ws://127.0.0.1:${LAPIS_RELAY_B_PORT:-8282},ws://127.0.0.1:${LAPIS_RELAY_C_PORT:-8283}
      REGISTRY_PUBLIC_COMMUNITY_RELAYS: ws://127.0.0.1:${LAPIS_COMMUNITY_RELAY_PORT:-8381}
      REGISTRY_PUBLISH_QUORUM: "2"
    depends_on:
      registry-official-a: { condition: service_healthy }
      registry-official-b: { condition: service_healthy }
      registry-official-c: { condition: service_healthy }
      registry-community: { condition: service_healthy }

  registry-console:
    environment:
      REGISTRY_OFFICIAL_RELAYS: ws://127.0.0.1:${LAPIS_RELAY_A_PORT:-8281},ws://127.0.0.1:${LAPIS_RELAY_B_PORT:-8282},ws://127.0.0.1:${LAPIS_RELAY_C_PORT:-8283}
      REGISTRY_COMMUNITY_RELAYS: ws://127.0.0.1:${LAPIS_COMMUNITY_RELAY_PORT:-8381}
      REGISTRY_PUBLISH_QUORUM: "2"

  registry-materializer:
    environment:
      REGISTRY_OFFICIAL_RELAYS: ws://registry-official-a:8181,ws://registry-official-b:8181,ws://registry-official-c:8181
      REGISTRY_COMMUNITY_RELAYS: ws://registry-community:8181
      REGISTRY_PUBLIC_OFFICIAL_RELAYS: ws://127.0.0.1:${LAPIS_RELAY_A_PORT:-8281},ws://127.0.0.1:${LAPIS_RELAY_B_PORT:-8282},ws://127.0.0.1:${LAPIS_RELAY_C_PORT:-8283}
      REGISTRY_PUBLIC_COMMUNITY_RELAYS: ws://127.0.0.1:${LAPIS_COMMUNITY_RELAY_PORT:-8381}

volumes:
  registry-official-a-data:
  registry-official-b-data:
  registry-official-c-data:
  registry-community-data:
