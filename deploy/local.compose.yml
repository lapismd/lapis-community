name: lapis-nostr-registry-local

services:
  registry-relay:
    image: ${LAPIS_RELAY_IMAGE:-lapis-relay:local}
    build:
      context: ${LAPIS_RELAY_PATH:?run the local stack through local-stack.sh}
      dockerfile: Dockerfile
    platform: ${IMAGE_PLATFORM:-linux/arm64}
    environment:
      PORT: "3334"
      DATABASE_URL: postgres://lapis_relay:lapis_relay_dev@postgres:5432/lapis_relay?sslmode=disable
      RELAY_HOST: registry.localhost:${LAPIS_RELAY_PORT:-8281}
      RELAY_SCHEMA: lapis_registry
      RELAY_SECRET: ${LAPIS_RELAY_SECRET:?ignored local relay secret is missing}
      RELAY_PUBKEY: ${REGISTRY_OPERATOR_PUBKEYS:?fixture operator is missing}
      ADMIN_PUBKEYS: ${LAPIS_RELAY_ADMIN_PUBKEYS:?ignored local relay admins are missing}
      POLICY_OPEN: "true"
      POLICY_PUBLIC_JOIN: "true"
      GROUPS_AUTO_JOIN: "true"
      GROUPS_ADMIN_CREATE_ONLY: "true"
      GROUPS_PRIVATE_ADMIN_ONLY: "true"
      GROUPS_PRIVATE_RELAY_ADMIN_ACCESS: "false"
      GROUP_REWRITE_DEBOUNCE_MS: "0"
      REGISTRY_POLICY_ENABLED: "true"
      REGISTRY_RELEASE_GROUP_ID: d792e601-8c97-5ac6-9446-d8215835de3c
      REGISTRY_CURATOR_ROLE: registry-curator
      BLOSSOM_ENABLED: "true"
      BLOSSOM_PUBLIC_URL: http://registry.localhost:${LAPIS_RELAY_PORT:-8281}
      GIT_ENABLED: "true"
      GIT_PUBLIC_URL: http://registry.localhost:${LAPIS_RELAY_PORT:-8281}
      GIT_BACKEND_URL: http://walgit:8080
      GIT_RECONCILE_INTERVAL: 1s
      GIT_MAX_DIFF_BYTES: "8388608"
      GIT_MAX_DIFF_FILES: "2000"
      WALGIT_RELAY_TOKEN: ${LAPIS_WALGIT_RELAY_TOKEN:?ignored local WalGit token is missing}
      WALGIT_WEBHOOK_SECRET: ${LAPIS_WALGIT_WEBHOOK_SECRET:?ignored local WalGit webhook secret is missing}
    ports:
      - "${LAPIS_RELAY_PORT:-8281}:3334"
    volumes:
      - lapis-relay-config:/app/config
      - lapis-relay-media:/app/media
    depends_on:
      postgres: { condition: service_healthy }
      walgit: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3334/health"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  postgres:
    image: ${POSTGRES_IMAGE:-postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73}
    environment:
      POSTGRES_DB: lapis_relay
      POSTGRES_USER: lapis_relay
      POSTGRES_PASSWORD: lapis_relay_dev
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes: [lapis-relay-postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lapis_relay -d lapis_relay"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  walgit:
    image: lapis-walgit:local
    build:
      context: ${LAPIS_RELAY_PATH:?run the local stack through local-stack.sh}
      dockerfile: third_party/walgit/Containerfile
      args:
        WALGIT_COMMIT: e5295e6ee45f5267c661f8bbd27ed0a07e55e7db
        WALGIT_ARCHIVE_SHA256: 9bb48e21c5647950e158068e1999bcb85cbae08c2730a5c3771b05259ec9d1ef
    environment:
      WALGIT_RELAY_TOKEN: ${LAPIS_WALGIT_RELAY_TOKEN:?ignored local WalGit token is missing}
      WALGIT__EVENTS__WEBHOOK_SECRET: ${LAPIS_WALGIT_WEBHOOK_SECRET:?ignored local WalGit webhook secret is missing}
      WALGIT__SERVER__PUBLIC_URL: http://registry.localhost:${LAPIS_RELAY_PORT:-8281}
      AWS_ACCESS_KEY_ID: ${LAPIS_RUSTFS_ACCESS_KEY:?ignored local RustFS access key is missing}
      AWS_SECRET_ACCESS_KEY: ${LAPIS_RUSTFS_SECRET_KEY:?ignored local RustFS secret key is missing}
    volumes:
      - lapis-walgit-cache:/var/lib/walgit
    depends_on:
      create-walgit-bucket: { condition: service_completed_successfully }
    restart: unless-stopped

  rustfs:
    image: rustfs/rustfs@sha256:b7014e0ce2bc703c1316b3ef760e29dfae61fe4a50d1a66fa89638e0f8ea211f
    environment:
      RUSTFS_ACCESS_KEY: ${LAPIS_RUSTFS_ACCESS_KEY:?ignored local RustFS access key is missing}
      RUSTFS_SECRET_KEY: ${LAPIS_RUSTFS_SECRET_KEY:?ignored local RustFS secret key is missing}
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_VOLUMES: /data
    volumes:
      - lapis-rustfs-data:/data
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  create-walgit-bucket:
    image: amazon/aws-cli@sha256:b6aeb95d19d7f5a8cae4eb814cb16739b6b2a4f2f46f427ada6a8c9a20d9881d
    depends_on:
      rustfs: { condition: service_healthy }
    environment:
      AWS_ACCESS_KEY_ID: ${LAPIS_RUSTFS_ACCESS_KEY:?ignored local RustFS access key is missing}
      AWS_SECRET_ACCESS_KEY: ${LAPIS_RUSTFS_SECRET_KEY:?ignored local RustFS secret key is missing}
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        aws --endpoint-url http://rustfs:9000 s3api head-bucket --bucket lapis-walgit
        || aws --endpoint-url http://rustfs:9000 s3api create-bucket --bucket lapis-walgit
    restart: "no"

  registry-fixture:
    image: ${REGISTRY_FIXTURE_IMAGE:-lapis-registry-local-fixture:local}
    build:
      context: ..
      dockerfile: deploy/fixture.Dockerfile
    read_only: true
    tmpfs: [/tmp]
    environment:
      PORT: 8090
      LAPIS_PLUGINS_ROOT: /workspace/lapis-plugins
      REGISTRY_FIXTURE_PLUGIN_LIMIT: ${REGISTRY_FIXTURE_PLUGIN_LIMIT:-all}
      REGISTRY_FIXTURE_LONG_THREAD_POSTS: ${REGISTRY_FIXTURE_LONG_THREAD_POSTS:-240}
      REGISTRY_FIXTURE_CREATED_AT: ${REGISTRY_FIXTURE_CREATED_AT:?fixture timestamp is missing}
      REGISTRY_FIXTURE_SECRETS_FILE: /run/lapis-registry/fixture-secrets.json
      REGISTRY_RELAY: ws://registry.localhost:${LAPIS_RELAY_PORT:-8281}
      REGISTRY_RELAY_JOIN_KIND: "28934"
      REGISTRY_RELAY_WRITE_RESTRICTED_RELEASES: "true"
      REGISTRY_EXPECT_ADMIN_ONLY_GROUP_CREATION: "true"
    ports:
      - "${REGISTRY_FIXTURE_PORT:-8090}:8090"
    volumes:
      - ${LAPIS_PLUGINS_PATH:?run pnpm local:up so lapis-plugins is resolved}:/workspace/lapis-plugins:ro
      - ${REGISTRY_FIXTURE_SECRETS_FILE:?run pnpm local:up to create fixture identities}:/run/lapis-registry/fixture-secrets.json:ro
    extra_hosts: [registry.localhost:host-gateway]
    depends_on:
      registry-relay: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8090/health"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s
    restart: on-failure:20

  registry-materializer:
    image: ${REGISTRY_FIXTURE_IMAGE:-lapis-registry-local-fixture:local}
    user: "0:0"
    read_only: true
    tmpfs: [/tmp]
    command:
      [
        "node",
        "dist/materializer/materialize-registry.js",
        "--output",
        "/projection/registry",
      ]
    environment:
      BLOSSOM_URL: http://registry.localhost:${LAPIS_RELAY_PORT:-8281}/
      REGISTRY_CURATOR_PUBKEYS: ${REGISTRY_CURATOR_PUBKEYS:?fixture curator is missing}
      REGISTRY_PUBLISHER_PUBKEYS: ${REGISTRY_PUBLISHER_PUBKEYS:?fixture publisher is missing}
      REGISTRY_AUTHORITY_EPOCH: ${REGISTRY_AUTHORITY_EPOCH:?fixture authority epoch is missing}
      REGISTRY_READER_SECRET_FILE: /run/lapis-registry/materializer-reader.key
      REGISTRY_RELAYS: ws://registry.localhost:${LAPIS_RELAY_PORT:-8281}
      REGISTRY_PUBLIC_RELAYS: ws://registry.localhost:${LAPIS_RELAY_PORT:-8281}
    volumes:
      - registry-projection:/projection
      - ${REGISTRY_READER_SECRET_FILE:?materializer reader secret is missing}:/run/lapis-registry/materializer-reader.key:ro
    extra_hosts: [registry.localhost:host-gateway]
    depends_on:
      registry-fixture: { condition: service_healthy }
    restart: "no"

  registry-site-builder:
    image: ${REGISTRY_SITE_IMAGE:-lapis-plugin-registry-site:local}
    build:
      context: ${PLUGIN_REGISTRY_PATH:?run pnpm local:up so nostr-plugin-registry is resolved}
      dockerfile: Dockerfile.local
    user: "0:0"
    environment:
      LAPIS_REGISTRY_SOURCE_DIR: /projection/registry
      LAPIS_REGISTRY_CONTAINER_SITE_DIR: /site
    command: ["node", "scripts/build-container-site.mjs"]
    volumes:
      - registry-projection:/projection:ro
      - registry-site:/site
    depends_on:
      registry-materializer: { condition: service_completed_successfully }
    restart: "no"

  registry-site:
    image: ${REGISTRY_SITE_IMAGE:-lapis-plugin-registry-site:local}
    read_only: true
    tmpfs: [/tmp]
    environment:
      HOST: 0.0.0.0
      PORT: 4321
    command: ["node", "scripts/serve-site.mjs", "--root", "/site"]
    ports:
      - "${REGISTRY_SITE_PORT:-4321}:4321"
    volumes: [registry-site:/site:ro]
    depends_on:
      registry-site-builder: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:4321/health"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 5s
    restart: unless-stopped

volumes:
  lapis-relay-config:
  lapis-relay-media:
  lapis-relay-postgres-data:
  lapis-walgit-cache:
  lapis-rustfs-data:
  registry-projection:
  registry-site:
