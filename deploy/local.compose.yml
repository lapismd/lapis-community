name: lapis-nostr-registry-local

services:
  registry-fixture:
    image: ${REGISTRY_FIXTURE_IMAGE:-lapis-registry-local-fixture:local}
    build:
      context: ..
      dockerfile: services/registry-local-fixture/Dockerfile
    read_only: true
    tmpfs:
      - /tmp
    environment:
      PORT: 8090
      LAPIS_PLUGINS_ROOT: /workspace/lapis-plugins
      REGISTRY_FIXTURE_ARTIFACT_BASE_URL: http://127.0.0.1:${REGISTRY_FIXTURE_PORT:-8090}/
      REGISTRY_FIXTURE_PLUGIN_LIMIT: ${REGISTRY_FIXTURE_PLUGIN_LIMIT:-all}
      REGISTRY_FIXTURE_LONG_THREAD_POSTS: ${REGISTRY_FIXTURE_LONG_THREAD_POSTS:-240}
      REGISTRY_FIXTURE_CREATED_AT: ${REGISTRY_FIXTURE_CREATED_AT:?fixture timestamp is missing}
      REGISTRY_FIXTURE_SECRETS_FILE: /run/lapis-registry/fixture-secrets.json
      REGISTRY_CURATOR_PUBKEYS: ${REGISTRY_CURATOR_PUBKEYS:?fixture curator is missing}
      REGISTRY_PUBLISHER_PUBKEY: ${REGISTRY_PUBLISHER_PUBKEY:?fixture publisher is missing}
      REGISTRY_OPERATOR_PUBKEYS: ${REGISTRY_OPERATOR_PUBKEYS:?fixture operator is missing}
    ports:
      - "${REGISTRY_FIXTURE_PORT:-8090}:8090"
    volumes:
      - ${LAPIS_PLUGINS_PATH:?run pnpm local:up so lapis-plugins is resolved}:/workspace/lapis-plugins:ro
      - ${REGISTRY_FIXTURE_SECRETS_FILE:?run pnpm local:up to create fixture identities}:/run/lapis-registry/fixture-secrets.json:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8090/health"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s
    restart: on-failure:20

  registry-materializer:
    image: ${REGISTRY_FIXTURE_IMAGE:-lapis-registry-local-fixture:local}
    user: "0:0"
    read_only: true
    tmpfs:
      - /tmp
    command: ["pnpm", "relay:materialize", "--output", "/projection/v1"]
    environment:
      REGISTRY_ASSET_FETCH_ORIGIN: http://registry-fixture:8090/
      REGISTRY_CURATOR_PUBKEYS: ${REGISTRY_CURATOR_PUBKEYS:?fixture curator is missing}
      REGISTRY_PUBLISHER_PUBKEY: ${REGISTRY_PUBLISHER_PUBKEY:?fixture publisher is missing}
      REGISTRY_FIXTURE_SECRETS_FILE: /run/lapis-registry/fixture-secrets.json
    volumes:
      - registry-projection:/projection
      - ${REGISTRY_FIXTURE_SECRETS_FILE:?run pnpm local:up to create fixture identities}:/run/lapis-registry/fixture-secrets.json:ro
    depends_on:
      registry-fixture:
        condition: service_healthy
    restart: "no"

  registry-site-builder:
    image: ${REGISTRY_SITE_IMAGE:-lapis-plugin-registry-site:local}
    build:
      context: ${PLUGIN_REGISTRY_PATH:?run pnpm local:up so plugin-registry is resolved}
      dockerfile: Dockerfile.local
    user: "0:0"
    environment:
      LAPIS_REGISTRY_BUILD_V1_DIR: /projection/v1
      LAPIS_REGISTRY_TRUSTED_SNAPSHOT_PUBKEYS: ${REGISTRY_SNAPSHOT_SIGNER_PUBKEYS:?fixture snapshot signer is missing}
      LAPIS_REGISTRY_BACKEND: buzz
      LAPIS_REGISTRY_CONTAINER_SITE_DIR: /site
    command: ["node", "scripts/build-container-site.mjs"]
    volumes:
      - registry-projection:/projection:ro
      - registry-site:/site
    depends_on:
      registry-materializer:
        condition: service_completed_successfully
    restart: "no"

  registry-site:
    image: ${REGISTRY_SITE_IMAGE:-lapis-plugin-registry-site:local}
    read_only: true
    tmpfs:
      - /tmp
    environment:
      HOST: 0.0.0.0
      PORT: 4321
    command: ["node", "scripts/serve-site.mjs", "--root", "/site"]
    ports:
      - "${REGISTRY_SITE_PORT:-4321}:4321"
    volumes:
      - registry-site:/site:ro
    depends_on:
      registry-site-builder:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:4321/health"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 5s
    restart: unless-stopped

volumes:
  registry-projection:
  registry-site:
