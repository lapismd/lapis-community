logging:
  level: "info"
  file: "debug"
  max_log_size_mb: 10
  structure: true
  stdout: true
  check_interval_min: 10
  backup_count: 2
  suppress_components:
    - "util"
    - "log"
    - "db-query"
    - "db-store"
    - "close-handler"
    - "client-main"
    - "client-api"
    - "client-core"
    - "client-tools"
    - "client-data"
    - "client-session"
    - "client-cache"

# The sibling relay profiles remain production-like. Four local test relays use
# smaller maps and process targets so Docker Desktop does not need 8+ GiB.
database:
  path: "data"
  map_size_mb: 256

client:
  index_relays: []
  connection_timeout: 10
  read_timeout: 30
  write_timeout: 10
  max_connections: 3
  retry_attempts: 3
  retry_delay: 2
  keep_alive: true
  user_agent: "lapis-registry-local/1.0"

server:
  port: :8181
  read_timeout: 60
  write_timeout: 20
  idle_timeout: 1200
  max_connections: 100
  max_subscriptions_per_client: 10
  implicit_req_limit: 500
  connection_rate_limit_per_ip: 30

resource_limits:
  cpu_cores: 1
  memory_mb: 512
  heap_size_mb: 256

auth:
  required: false
  relay_url: ""
  relay_url_match: "strict"

backup_relay:
  enabled: false
  urls: []

event_purge:
  enabled: false
  disable_at_startup: true
  keep_interval_hours: 24
  purge_interval_minutes: 240
  purge_by_category:
    regular: false
    replaceable: false
    addressable: false
    deprecated: false
  purge_by_kind_enabled: false
  kinds_to_purge: []
  exclude_whitelisted: true

event_time_constraints:
  min_created_at: 1577836800
  max_created_at_string: now+5m

rate_limit:
  ws_limit: 50
  ws_burst: 100
  event_limit: 10
  event_burst: 20
  req_limit: 10
  req_burst: 30
  max_event_size: 524288
  kind_size_limits:
    - kind: 1063
      max_size: 65536
    - kind: 1111
      max_size: 16384
    - kind: 1984
      max_size: 16384
    - kind: 1985
      max_size: 65536
    - kind: 30063
      max_size: 262144
    - kind: 32267
      max_size: 262144
  category_limits:
    regular:
      limit: 8
      burst: 16
    replaceable:
      limit: 5
      burst: 10
    ephemeral:
      limit: 20
      burst: 40
    addressable:
      limit: 3
      burst: 8
  kind_limits: []
