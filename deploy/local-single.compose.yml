name: lapis-nostr-registry-local-single

x-strfry: &strfry
  image: ${STRFRY_REGISTRY_IMAGE:-nostr-relay-strfry-registry:local}
  healthcheck:
    test: ["CMD", "/app/lapis-registry-policy", "healthcheck", "127.0.0.1:7777"]
    interval: 5s
    timeout: 3s
    retries: 30
    start_period: 10s
  restart: unless-stopped

services:
  registry-relay:
    <<: *strfry
    environment:
      LAPIS_STRFRY_POLICY_MODE: local
      LAPIS_STRFRY_ALLOWED_KINDS: ${REGISTRY_LOCAL_KINDS:-3,1063,1111,1984,1985,30063,30267,32267,64000,64001,64002,64003,64004,64005,64006}
    ports:
      - "${STRFRY_LOCAL_PORT:-8281}:7777"
    volumes:
      - registry-relay-data:/app/strfry-db
      - ${NOSTR_RELAY_CONTEXT:?run pnpm local:up so nostr-relay is resolved}/deploy/strfry/profiles/registry-local.conf:/app/strfry.conf:ro

  registry-fixture:
    environment:
      REGISTRY_OFFICIAL_RELAYS: ws://registry-relay:7777
      REGISTRY_COMMUNITY_RELAY: ws://registry-relay:7777
      REGISTRY_PUBLISH_QUORUM: "1"
    depends_on:
      registry-relay:
        condition: service_healthy

  registry-console:
    environment:
      REGISTRY_OFFICIAL_RELAYS: ws://127.0.0.1:${STRFRY_LOCAL_PORT:-8281}
      REGISTRY_COMMUNITY_RELAYS: ws://127.0.0.1:${STRFRY_LOCAL_PORT:-8281}
      REGISTRY_PUBLISH_QUORUM: "1"

volumes:
  registry-relay-data:
