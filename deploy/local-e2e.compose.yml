name: lapis-nostr-registry-local-e2e

x-grain: &grain
  image: ${GRAIN_IMAGE:-nostr-relay-grain:local}
  environment:
    GRAIN_DATA_DIR: /home/grain/.grain
    GRAIN_ENV: development
    GRAIN_PROFILE: registry-official
    GRAIN_OWNER_PUBKEY: ${GRAIN_OFFICIAL_OWNER_PUBKEY:?run pnpm local:up to create fixture identities}
  healthcheck:
    test:
      [
        "CMD",
        "wget",
        "--no-verbose",
        "--tries=1",
        "--spider",
        "http://127.0.0.1:8181/",
      ]
    interval: 5s
    timeout: 3s
    retries: 30
    start_period: 20s
  restart: unless-stopped

services:
  registry-official-a:
    <<: *grain
    ports:
      - "${GRAIN_OFFICIAL_A_PORT:-8281}:8181"
    volumes:
      - registry-official-a-data:/home/grain/.grain
      - ./local-grain/config.yml:/home/grain/.grain/config.yml:ro
      - ${REGISTRY_FIXTURE_WHITELIST_FILE:?run pnpm local:up to create the whitelist}:/home/grain/.grain/whitelist.yml:ro

  registry-official-b:
    <<: *grain
    ports:
      - "${GRAIN_OFFICIAL_B_PORT:-8282}:8181"
    volumes:
      - registry-official-b-data:/home/grain/.grain
      - ./local-grain/config.yml:/home/grain/.grain/config.yml:ro
      - ${REGISTRY_FIXTURE_WHITELIST_FILE:?run pnpm local:up to create the whitelist}:/home/grain/.grain/whitelist.yml:ro

  registry-official-c:
    <<: *grain
    ports:
      - "${GRAIN_OFFICIAL_C_PORT:-8283}:8181"
    volumes:
      - registry-official-c-data:/home/grain/.grain
      - ./local-grain/config.yml:/home/grain/.grain/config.yml:ro
      - ${REGISTRY_FIXTURE_WHITELIST_FILE:?run pnpm local:up to create the whitelist}:/home/grain/.grain/whitelist.yml:ro

  registry-community:
    <<: *grain
    environment:
      GRAIN_DATA_DIR: /home/grain/.grain
      GRAIN_ENV: development
      GRAIN_PROFILE: registry-community
      GRAIN_OWNER_PUBKEY: ${GRAIN_COMMUNITY_OWNER_PUBKEY:?run pnpm local:up to create fixture identities}
    ports:
      - "${GRAIN_COMMUNITY_PORT:-8381}:8181"
    volumes:
      - registry-community-data:/home/grain/.grain
      - ./local-grain/config.yml:/home/grain/.grain/config.yml:ro

  registry-service:
    environment:
      REGISTRY_ASSESSOR_PUBKEYS: ${REGISTRY_ASSESSOR_PUBKEYS:?fixture assessor is missing}
      REGISTRY_CURATOR_PUBKEYS: ${REGISTRY_CURATOR_PUBKEYS:?fixture curator is missing}
      REGISTRY_MODERATOR_PUBKEYS: ${REGISTRY_MODERATOR_PUBKEYS:?fixture moderator is missing}
      REGISTRY_SNAPSHOT_SIGNER_PUBKEYS: ${REGISTRY_SNAPSHOT_SIGNER_PUBKEYS:?fixture snapshot signer is missing}
      REGISTRY_OPERATOR_PUBKEYS: ${REGISTRY_OPERATOR_PUBKEYS:?fixture operator is missing}
      REGISTRY_SECURITY_ADVISORY_PUBKEYS: ${REGISTRY_SECURITY_ADVISORY_PUBKEYS:?fixture advisory authority is missing}
      REGISTRY_SECURITY_DISPOSITION_PUBKEYS: ${REGISTRY_SECURITY_DISPOSITION_PUBKEYS:?fixture disposition authority is missing}

  registry-fixture:
    image: ${REGISTRY_FIXTURE_IMAGE:-lapis-registry-local-fixture:local}
    build:
      context: ..
      dockerfile: services/registry-local-fixture/Dockerfile
    read_only: true
    tmpfs:
      - /tmp
    environment:
      PORT: 8090
      LAPIS_PLUGINS_ROOT: /workspace/lapis-plugins
      REGISTRY_API_INTERNAL: http://registry-service:8787/
      REGISTRY_FIXTURE_ARTIFACT_BASE_URL: http://127.0.0.1:${REGISTRY_FIXTURE_PORT:-8090}/
      REGISTRY_FIXTURE_PLUGIN_LIMIT: ${REGISTRY_FIXTURE_PLUGIN_LIMIT:-3}
      REGISTRY_FIXTURE_CREATED_AT: ${REGISTRY_FIXTURE_CREATED_AT:-1767225600}
      REGISTRY_FIXTURE_SECRETS_FILE: /run/lapis-registry/fixture-secrets.json
      REGISTRY_OFFICIAL_RELAYS: ws://registry-official-a:8181,ws://registry-official-b:8181,ws://registry-official-c:8181
      REGISTRY_COMMUNITY_RELAY: ws://registry-community:8181
    ports:
      - "${REGISTRY_FIXTURE_PORT:-8090}:8090"
    volumes:
      - ${LAPIS_PLUGINS_PATH:?run pnpm local:up so lapis-plugins is resolved}:/workspace/lapis-plugins:ro
      - ${REGISTRY_FIXTURE_SECRETS_FILE:?run pnpm local:up to create fixture identities}:/run/lapis-registry/fixture-secrets.json:ro
    depends_on:
      registry-service:
        condition: service_healthy
      registry-official-a:
        condition: service_started
      registry-official-b:
        condition: service_started
      registry-official-c:
        condition: service_started
      registry-community:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8090/health"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s
    restart: on-failure:20

  registry-console:
    image: ${REGISTRY_CONSOLE_IMAGE:-lapis-registry-console:local}
    build:
      context: ..
      dockerfile: apps/registry-console/Dockerfile
    read_only: true
    tmpfs:
      - /tmp
    environment:
      HOST: 0.0.0.0
      PORT: 4173
    ports:
      - "${REGISTRY_CONSOLE_PORT:-4173}:4173"
    depends_on:
      registry-fixture:
        condition: service_healthy
    restart: unless-stopped

volumes:
  registry-official-a-data:
  registry-official-b-data:
  registry-official-c-data:
  registry-community-data:
