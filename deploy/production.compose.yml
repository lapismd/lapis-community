name: lapis-nostr-registry-production

services:
  registry-console:
    image: ${REGISTRY_CONSOLE_IMAGE:?set REGISTRY_CONSOLE_IMAGE to an immutable published digest}
    read_only: true
    tmpfs:
      - /tmp
    environment:
      HOST: 0.0.0.0
      NODE_ENV: production
      PORT: 4173
      REGISTRY_OFFICIAL_RELAYS: ${REGISTRY_OFFICIAL_RELAYS:?set REGISTRY_OFFICIAL_RELAYS}
      REGISTRY_COMMUNITY_RELAYS: ${REGISTRY_COMMUNITY_RELAYS:?set REGISTRY_COMMUNITY_RELAYS}
      REGISTRY_PUBLISH_QUORUM: ${REGISTRY_PUBLISH_QUORUM:?set REGISTRY_PUBLISH_QUORUM}
      REGISTRY_APPROVAL_KIND: ${REGISTRY_APPROVAL_KIND:?set after kind ADR approval}
      REGISTRY_MODERATION_DECISION_KIND: ${REGISTRY_MODERATION_DECISION_KIND:?set after kind ADR approval}
      REGISTRY_REVOCATION_KIND: ${REGISTRY_REVOCATION_KIND:?set after kind ADR approval}
      REGISTRY_SNAPSHOT_KIND: ${REGISTRY_SNAPSHOT_KIND:?set after kind ADR approval}
      REGISTRY_RATING_KIND: ${REGISTRY_RATING_KIND:?set after kind ADR approval}
      REGISTRY_SECURITY_ADVISORY_KIND: ${REGISTRY_SECURITY_ADVISORY_KIND:?set after kind ADR approval}
      REGISTRY_SECURITY_DISPOSITION_KIND: ${REGISTRY_SECURITY_DISPOSITION_KIND:?set after kind ADR approval}
      REGISTRY_ASSESSOR_PUBKEYS: ${REGISTRY_ASSESSOR_PUBKEYS:?set REGISTRY_ASSESSOR_PUBKEYS}
      REGISTRY_CURATOR_PUBKEYS: ${REGISTRY_CURATOR_PUBKEYS:?set REGISTRY_CURATOR_PUBKEYS}
      REGISTRY_MODERATOR_PUBKEYS: ${REGISTRY_MODERATOR_PUBKEYS:?set REGISTRY_MODERATOR_PUBKEYS}
      REGISTRY_SNAPSHOT_SIGNER_PUBKEYS: ${REGISTRY_SNAPSHOT_SIGNER_PUBKEYS:?set REGISTRY_SNAPSHOT_SIGNER_PUBKEYS}
      REGISTRY_OPERATOR_PUBKEYS: ${REGISTRY_OPERATOR_PUBKEYS:?set REGISTRY_OPERATOR_PUBKEYS}
      REGISTRY_PUBLISHERS_JSON: ${REGISTRY_PUBLISHERS_JSON:-}
      REGISTRY_SECURITY_ADVISORY_PUBKEYS: ${REGISTRY_SECURITY_ADVISORY_PUBKEYS:?set REGISTRY_SECURITY_ADVISORY_PUBKEYS}
      REGISTRY_SECURITY_DISPOSITION_PUBKEYS: ${REGISTRY_SECURITY_DISPOSITION_PUBKEYS:?set REGISTRY_SECURITY_DISPOSITION_PUBKEYS}
    expose:
      - "4173"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:4173/"]
      interval: 10s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped
